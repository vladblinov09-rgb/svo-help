<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Помощь СВО</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M16 6l9 4v6c0 5-3.8 8.6-9 10-5.2-1.4-9-5-9-10v-6l9-4z' fill='none' stroke='%23e0474f' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d12; --bg-soft:#10131c; --card:#141926; --card-hover:#181e2e;
    --border:#232b3d; --text:#e9edf5; --muted:#98a2b8; --accent:#e0474f;
    --accent-soft:rgba(224,71,79,.12); --accent-grad:linear-gradient(135deg,#e0474f,#ff7a5c);
    --ok:#3fb27f; --warn:#e8a33d; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.16s;white-space:nowrap;font-family:inherit}
  .btn-primary{background:var(--accent-grad);color:#fff}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:var(--card);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{background:var(--card-hover);border-color:#33405a}
  .btn-ok{background:rgba(63,178,127,.15);border-color:rgba(63,178,127,.4);color:var(--ok)}
  .btn-ok:hover{background:rgba(63,178,127,.25)}
  .btn-warn{background:rgba(232,163,61,.13);border-color:rgba(232,163,61,.4);color:var(--warn)}
  .btn-warn:hover{background:rgba(232,163,61,.22)}
  .btn-danger{background:rgba(224,71,79,.13);border-color:rgba(224,71,79,.4);color:#ff8a90}
  .btn-danger:hover{background:rgba(224,71,79,.25)}
  .btn:disabled{opacity:.55;cursor:wait;transform:none}

  header.top{position:sticky;top:0;z-index:40;background:rgba(11,13,18,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;height:60px;max-width:1280px;margin:0 auto;padding:0 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
  .brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .online-badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:13px;color:var(--muted)}
  .online-badge b{color:var(--text)}
  .online-badge .ld{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .live-tag{font-size:11.5px;font-weight:700;color:var(--ok);letter-spacing:.06em}

  .wrap{max-width:1280px;margin:0 auto;padding:24px 20px 60px}

  .login-box{max-width:400px;margin:12vh auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px}
  .login-box h1{font-size:22px;font-weight:800;margin-bottom:6px}
  .login-box p{color:var(--muted);font-size:14px;margin-bottom:22px}
  input,select,textarea{width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14.5px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
  .login-err{color:#ff8a90;font-size:13.5px;margin-top:10px;min-height:20px}

  .stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat-card .num{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat-card.hl{border-color:rgba(224,71,79,.45);background:linear-gradient(180deg,rgba(224,71,79,.10),var(--card))}
  .stat-card.hl .num{color:var(--accent)}
  @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

  .panels{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:22px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
  .panel h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  @media(max-width:960px){.panels{grid-template-columns:1fr}}

  .cat-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13.5px}
  .cat-row .cname{flex:0 0 220px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-row .bar{flex:1;height:8px;background:var(--bg-soft);border-radius:6px;overflow:hidden}
  .cat-row .bar i{display:block;height:100%;background:var(--accent-grad);border-radius:6px;transition:width .4s}
  .cat-row .cval{flex:0 0 28px;text-align:right;font-weight:700}
  @media(max-width:560px){.cat-row .cname{flex-basis:120px}}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{max-width:260px}
  .toolbar select{max-width:220px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text)}
  .chip.active{background:var(--accent-soft);border-color:rgba(224,71,79,.5);color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr{cursor:pointer;transition:.12s}
  tbody tr:hover{background:var(--card-hover)}
  tbody tr.fresh{animation:flash 1.6s ease}
  @keyframes flash{0%{background:rgba(224,71,79,.25)}100%{background:transparent}}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent)}
  .muted{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .b-new{background:rgba(224,71,79,.15);color:#ff8a90}
  .b-in_progress{background:rgba(232,163,61,.14);color:var(--warn)}
  .b-answered{background:rgba(63,178,127,.14);color:var(--ok)}
  .b-closed{background:rgba(152,162,184,.14);color:var(--muted)}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}

  .overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--bg-soft);border:1px solid var(--border);border-radius:18px;width:100%;max-width:760px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:20px 22px;border-bottom:1px solid var(--border)}
  .modal-head .mono{font-size:15px}
  .modal-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:2px 8px}
  .x:hover{color:var(--text)}
  .modal-body{padding:20px 22px}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-bottom:20px;font-size:14px}
  .meta-grid div span{display:block;font-size:12px;color:var(--muted)}
  @media(max-width:560px){.meta-grid{grid-template-columns:1fr}}
  .thread{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg .who{display:block;font-size:11.5px;font-weight:700;margin-bottom:4px;opacity:.75}
  .msg .time{display:block;font-size:11px;margin-top:6px;opacity:.55}
  .msg.user{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.user .who{color:var(--accent)}
  .msg.admin{align-self:flex-end;background:rgba(224,71,79,.13);border:1px solid rgba(224,71,79,.35);border-bottom-right-radius:4px}
  .msg.admin .who{color:var(--ok)}
  .atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .att{display:inline-flex;align-items:center;gap:7px;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
  .att:hover{border-color:var(--accent);color:var(--text)}
  .att-img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block}
  .reply-box{border-top:1px solid var(--border);padding-top:18px}
  .reply-box textarea{min-height:90px;resize:vertical;margin-bottom:10px}
  .reply-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .reply-row input[type=file]{display:none}
  .reply-row select{max-width:230px;font-size:13px;padding:8px 11px}
  .file-btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:13px;color:var(--muted);cursor:pointer}
  .file-btn:hover{color:var(--text);border-color:#33405a}
  .status-btns{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 20px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:10px;padding:11px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:200;display:none;max-width:80vw}
  .toast.show{display:block;animation:pop .2s ease}
  .toast.err{border-left-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted)}
  kbd{background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:inherit}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/admin">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#141926"/>
        <path d="M16 6l9 4v6c0 5-3.8 8.6-9 10-5.2-1.4-9-5-9-10v-6l9-4z" stroke="#e0474f" stroke-width="2"/>
        <path d="M12 16l3 3 5-6" stroke="#e0474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Панель обращений <small>Помощь СВО</small>
    </a>
    <div class="top-actions" id="topActions" style="display:none">
      <span class="online-badge"><span class="ld"></span>онлайн на сайте: <b id="onlineNow">…</b></span>
      <span class="live-tag" id="liveTag">LIVE</span>
      <span class="hint" id="adminUrl"></span>
      <button class="btn btn-ghost" id="soundBtn" type="button" title="Звуковое уведомление о новом обращении">🔔 Звук вкл</button>
      <button class="btn btn-ghost" id="refreshBtn" type="button">Обновить</button>
      <a class="btn btn-ghost" href="/" target="_blank">Открыть сайт</a>
      <button class="btn btn-danger" id="resetBtn" type="button">Очистить всё</button>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Выйти</button>
    </div>
  </div>
</header>

<div class="login-box" id="loginBox">
  <h1>Вход для администратора</h1>
  <p>Введите пароль, чтобы увидеть обращения и статистику.</p>
  <form id="loginForm">
    <label for="pwd">Пароль</label>
    <input id="pwd" type="password" placeholder="Пароль администратора" autocomplete="current-password" required>
    <div class="login-err" id="loginErr"></div>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">Войти</button>
  </form>
</div>

<div class="wrap" id="panel" style="display:none">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="panels">
    <div class="panel">
      <h3>Обращения по дням (14 дней)</h3>
      <div id="chart"></div>
    </div>
    <div class="panel">
      <h3>По направлениям</h3>
      <div id="cats"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="chips" id="statusChips"></div>
    <select id="catFilter"><option value="">Все направления</option></select>
    <input type="search" id="searchInput" placeholder="Поиск: номер, имя, контакт, текст…">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Номер</th><th>Дата</th><th>Имя</th><th>Контакт</th><th>Направление</th><th>Кабинет</th><th>Статус</th><th>Файлы</th><th>Сообщения</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">Обращений пока нет</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="mono" id="mId"></div>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="x" id="mClose" type="button" aria-label="Закрыть">&times;</button>
    </div>
    <div class="modal-body">
      <div class="meta-grid" id="mMeta"></div>
      <div class="thread" id="mThread"></div>
    </div>
    <div class="status-btns" id="mStatusBtns"></div>
    <div class="modal-body reply-box">
      <label for="replyText">Ответ от администратора <span class="hint">(Ctrl+Enter — отправить)</span></label>
      <textarea id="replyText" placeholder="Напишите ответ…"></textarea>
      <div class="reply-row">
        <select id="tplSelect" title="Вставить готовый ответ">
          <option value="">Шаблон ответа…</option>
        </select>
        <label class="file-btn" for="replyFiles">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.6l-9 9a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg>
          Прикрепить файлы
        </label>
        <input id="replyFiles" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.txt,.doc,.docx,.odt,.rtf,.zip">
        <span class="hint" id="replyFilesHint"></span>
        <button class="btn btn-primary" id="sendReplyBtn" type="button" style="margin-left:auto">Отправить ответ</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var TOKEN_KEY = 'svo_admin_token';
  var SOUND_KEY = 'svo_admin_sound';
  var CATEGORIES = ['Выплаты и компенсации','ВВК и медосвидетельствование','Увольнение и перевод','Документы и справки','Поддержка семей','Другой вопрос'];
  var STATUSES = {new:'Новое', in_progress:'В работе', answered:'Отвечено', closed:'Закрыто'};
  var TEMPLATES = [
    'Здравствуйте! Разобрались в вашем вопросе. Уточните, пожалуйста, какие документы уже есть на руках?',
    'Добрый день! Для разбора ситуации нужны фото или сканы документов — прикрепите, пожалуйста, их к обращению.',
    'Мы разобрались в ситуации. Рекомендуемый порядок действий: 1) подготовить документы; 2) подать заявление; 3) отслеживать сроки рассмотрения. Напишем, если нужны детали.',
    'Ваше обращение переведено в статус «В работе» — ответим в ближайшее время.',
    'Обращение закрыто. Если появятся новые вопросы — создайте новое обращение на сайте, поможем.'
  ];
  var state = { token: sessionStorage.getItem(TOKEN_KEY) || '', status:'', category:'', q:'', selected:null, timer:null, es:null, knownIds:{}, firstLoad:true, sound: localStorage.getItem(SOUND_KEY) !== 'off' };

  var $ = function(id){ return document.getElementById(id); };

  function toast(msg, isErr){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  function beep(){
    if(!state.sound) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      if(!state.audio) state.audio = new Ctx();
      var ctx = state.audio, t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.setValueAtTime(660, t + 0.12);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.36);
    }catch(e){}
  }

  var NOT_FROM_SERVER = 'Похоже, страница открыта из превью файла, а не с сервера — поэтому запросы не работают. Откройте живой сайт через превью запущенного процесса «Сайт приёма обращений» (справа вверху) и перейдите на /admin.';
  function parseJson(r){
    return r.text().then(function(txt){
      var j;
      try{ j = JSON.parse(txt); }
      catch(e){
        if(r.status === 405 || txt.indexOf('Method Not Allowed') !== -1 || txt.indexOf('Cannot') !== -1){
          throw new Error(NOT_FROM_SERVER);
        }
        throw new Error('Сервер вернул неожиданный ответ');
      }
      return j;
    });
  }
  function api(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    if(state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if(opts.body && !(opts.body instanceof FormData)) opts.headers['Content-Type'] = 'application/json';
    return fetch(path, opts).then(function(r){
      return parseJson(r).then(function(j){
        if(r.status === 401){ logout(); throw new Error('Сессия истекла — войдите снова'); }
        if(!r.ok) throw new Error(j.error || 'Ошибка запроса');
        return j;
      });
    });
  }

  /* ---------- логин ---------- */
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    $('loginErr').textContent = '';
    api('/api/login', { method:'POST', body: JSON.stringify({ password: $('pwd').value }) })
      .then(function(j){
        state.token = j.token;
        sessionStorage.setItem(TOKEN_KEY, j.token);
        showPanel();
      })
      .catch(function(err){ $('loginErr').textContent = err.message; });
  });

  function logout(){
    state.token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    if(state.es){ try{ state.es.close(); }catch(e){} state.es = null; }
    if(state.timer){ clearInterval(state.timer); state.timer = null; }
    $('panel').style.display = 'none';
    $('topActions').style.display = 'none';
    $('loginBox').style.display = 'block';
    $('pwd').value = '';
  }
  $('logoutBtn').addEventListener('click', logout);

  function showPanel(){
    $('loginBox').style.display = 'none';
    $('panel').style.display = 'block';
    $('topActions').style.display = 'flex';
    updateSoundBtn();
    buildFilters();
    buildTemplates();
    refreshAll();
    startLive();
  }

  /* ---------- реальное время ---------- */
  function updateLiveTag(){
    var t = $('liveTag');
    if(!t) return;
    t.textContent = state.es ? 'LIVE' : 'обновление 6с';
    t.style.color = state.es ? 'var(--ok)' : 'var(--muted)';
  }
  function startLive(){
    if(state.es){ try{ state.es.close(); }catch(e){} state.es = null; }
    // страховочный опрос: работает всегда, даже если хостинг буферизует SSE (туннели, прокши)
    if(state.timer) clearInterval(state.timer);
    state.timer = setInterval(refreshAll, 6000);
    state.sseMsgAt = Date.now();
    try{
      var es = new EventSource('/api/admin-stream?token=' + encodeURIComponent(state.token));
      state.es = es;
      es.onmessage = function(e){
        state.sseMsgAt = Date.now();
        try{
          var d = JSON.parse(e.data);
          if(d.online !== undefined) $('onlineNow').textContent = d.online;
          if(d.publicUrl) $('adminUrl').textContent = 'ссылка: ' + d.publicUrl;
          refreshAll();
        }catch(err){}
      };
      es.onerror = function(){ /* EventSource переподключается сам */ };
    }catch(e){}
    // публичный адрес сайта — отдельный поток без авторизации
    try{
      var es2 = new EventSource('/api/live');
      es2.onmessage = function(e){
        try{ var d2 = JSON.parse(e.data); if(d2.publicUrl) $('adminUrl').textContent = 'ссылка: ' + d2.publicUrl; }catch(err){}
      };
    }catch(e){}
    // watchdog: если SSE молчит 10 секунд — значит поток заблокирован, работаем на опросе
    if(state.watchdog) clearInterval(state.watchdog);
    state.watchdog = setInterval(function(){
      if(state.es && Date.now() - state.sseMsgAt > 10000){
        try{ state.es.close(); }catch(e){}
        state.es = null;
      }
      updateLiveTag();
    }, 3000);
    updateLiveTag();
  }

  /* ---------- фильтры и шаблоны ---------- */
  function buildFilters(){
    var chips = $('statusChips');
    chips.textContent = '';
    var all = document.createElement('button');
    all.type='button'; all.className='chip' + (state.status===''?' active':''); all.textContent='Все';
    all.addEventListener('click', function(){ state.status=''; buildFilters(); loadAppeals(); });
    chips.appendChild(all);
    Object.keys(STATUSES).forEach(function(s){
      var b = document.createElement('button');
      b.type='button'; b.className='chip' + (state.status===s?' active':'');
      b.textContent = STATUSES[s];
      b.addEventListener('click', function(){ state.status=s; buildFilters(); loadAppeals(); });
      chips.appendChild(b);
    });
    var sel = $('catFilter');
    sel.textContent = '';
    var o0 = document.createElement('option'); o0.value=''; o0.textContent='Все направления'; sel.appendChild(o0);
    CATEGORIES.forEach(function(c){
      var o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
    });
    sel.value = state.category;
  }
  $('catFilter').addEventListener('change', function(){ state.category=this.value; loadAppeals(); });
  var searchH;
  $('searchInput').addEventListener('input', function(){
    var v = this.value;
    clearTimeout(searchH);
    searchH = setTimeout(function(){ state.q = v.trim(); loadAppeals(); }, 300);
  });
  $('refreshBtn').addEventListener('click', refreshAll);

  function buildTemplates(){
    var sel = $('tplSelect');
    sel.textContent = '';
    var o0 = document.createElement('option'); o0.value=''; o0.textContent='Шаблон ответа…'; sel.appendChild(o0);
    TEMPLATES.forEach(function(t, i){
      var o = document.createElement('option'); o.value = String(i); o.textContent = t.slice(0, 46) + (t.length > 46 ? '…' : '');
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){
      var i = this.value;
      if(i === '') return;
      var ta = $('replyText');
      var text = TEMPLATES[Number(i)];
      if(ta.value.trim()) text = ta.value.trim() + '\n\n' + text;
      ta.value = text;
      ta.focus();
      this.value = '';
    });
  }

  function updateSoundBtn(){
    var b = $('soundBtn');
    b.textContent = state.sound ? '🔔 Звук вкл' : '🔕 Звук выкл';
    b.style.opacity = state.sound ? '1' : '.65';
  }
  $('soundBtn').addEventListener('click', function(){
    state.sound = !state.sound;
    localStorage.setItem(SOUND_KEY, state.sound ? 'on' : 'off');
    updateSoundBtn();
    if(state.sound) beep();
  });

  /* ---------- данные ---------- */
  function refreshAll(){
    loadStats();
    loadAppeals();
    if(state.selected) openAppeal(state.selected, true);
  }

  function loadStats(){
    api('/api/stats').then(function(s){
      var cards = [
        { num: s.total, lbl: 'Всего обращений' },
        { num: s.byStatus.new, lbl: 'Новые', hl: s.byStatus.new > 0 },
        { num: s.byStatus.in_progress, lbl: 'В работе' },
        { num: s.byStatus.answered, lbl: 'Отвечено' },
        { num: s.byStatus.closed, lbl: 'Закрыто' },
        { num: s.files, lbl: 'Файлов прикреплено' }
      ];
      var grid = $('statsGrid'); grid.textContent='';
      cards.forEach(function(c){
        var d = document.createElement('div');
        d.className = 'stat-card' + (c.hl ? ' hl' : '');
        var n = document.createElement('div'); n.className='num'; n.textContent = c.num;
        var l = document.createElement('div'); l.className='lbl'; l.textContent = c.lbl;
        d.appendChild(n); d.appendChild(l); grid.appendChild(d);
      });

      var chart = $('chart'); chart.textContent='';
      var max = Math.max.apply(null, s.daily.map(function(d){return d.count;}).concat([1]));
      var W = Math.max(320, chart.clientWidth || 560), H = 150, pad = 22;
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('width','100%'); svg.setAttribute('height',H); svg.setAttribute('viewBox','0 0 ' + W + ' ' + H);
      s.daily.forEach(function(d, i){
        var bw = (W - pad) / s.daily.length;
        var h = Math.max(3, (H - pad) * d.count / max);
        var x = i * bw + bw*0.18, y = H - pad - h + 8, w = bw*0.64;
        var r = document.createElementNS('http://www.w3.org/2000/svg','rect');
        r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',h);
        r.setAttribute('rx','4'); r.setAttribute('fill','url(#g1)');
        var t = document.createElementNS('http://www.w3.org/2000/svg','title');
        t.textContent = d.date.slice(8)+'.'+d.date.slice(5,7) + ' — ' + d.count;
        r.appendChild(t); svg.appendChild(r);
        if(i % 2 === 0){
          var tx = document.createElementNS('http://www.w3.org/2000/svg','text');
          tx.setAttribute('x', x + w/2); tx.setAttribute('y', H - 6);
          tx.setAttribute('fill','#98a2b8'); tx.setAttribute('font-size','10'); tx.setAttribute('text-anchor','middle');
          tx.textContent = d.date.slice(8)+'.'+d.date.slice(5,7);
          svg.appendChild(tx);
        }
      });
      var defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      var lg = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
      lg.setAttribute('id','g1'); lg.setAttribute('x1','0'); lg.setAttribute('y1','0'); lg.setAttribute('x2','0'); lg.setAttribute('y2','1');
      var s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#ff7a5c');
      var s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#e0474f');
      lg.appendChild(s1); lg.appendChild(s2); defs.appendChild(lg); svg.appendChild(defs);
      chart.appendChild(svg);

      var extra = document.createElement('p');
      extra.className = 'hint'; extra.style.marginTop = '10px';
      extra.textContent = 'Среднее время первого ответа: ' + (s.avgResponseHours === null ? '—' : s.avgResponseHours + ' ч') +
        ' · Ответов отправлено: ' + s.adminMessages;
      chart.appendChild(extra);

      var cats = $('cats'); cats.textContent='';
      var maxC = Math.max.apply(null, s.byCategory.map(function(c){return c.count;}).concat([1]));
      s.byCategory.forEach(function(c){
        var row = document.createElement('div'); row.className='cat-row';
        var n = document.createElement('div'); n.className='cname'; n.textContent = c.category; n.title = c.category;
        var bar = document.createElement('div'); bar.className='bar';
        var i = document.createElement('i'); i.style.width = (c.count/maxC*100) + '%';
        bar.appendChild(i);
        var v = document.createElement('div'); v.className='cval'; v.textContent = c.count;
        row.appendChild(n); row.appendChild(bar); row.appendChild(v);
        cats.appendChild(row);
      });
    }).catch(function(err){ toast(err.message, true); });
  }

  function loadAppeals(){
    var q = [];
    if(state.status) q.push('status=' + encodeURIComponent(state.status));
    if(state.category) q.push('category=' + encodeURIComponent(state.category));
    if(state.q) q.push('q=' + encodeURIComponent(state.q));
    return api('/api/appeals' + (q.length ? '?' + q.join('&') : ''))
      .then(function(list){
        var tb = $('rows'); tb.textContent='';
        $('emptyMsg').style.display = list.length ? 'none' : 'block';
        var fresh = [];
        list.forEach(function(a){
          if(!state.knownIds[a.id]){
            state.knownIds[a.id] = true;
            if(!state.firstLoad) fresh.push(a.id);
          }
          var tr = document.createElement('tr');
          if(fresh.indexOf(a.id) !== -1) tr.className = 'fresh';
          tr.addEventListener('click', function(){ openAppeal(a.id); });
          function td(txt, cls){ var c = document.createElement('td'); if(cls) c.className=cls; c.textContent = txt; return c; }
          tr.appendChild(td(a.id, 'mono'));
          tr.appendChild(td(new Date(a.created_at).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}), 'muted'));
          tr.appendChild(td(a.name));
          tr.appendChild(td(a.contact, 'muted'));
          tr.appendChild(td(a.category, 'muted'));
          tr.appendChild(td(a.user_login || 'аноним', a.user_login ? 'mono' : 'muted'));
          var st = document.createElement('td');
          var b = document.createElement('span');
          b.className = 'badge b-' + a.status; b.textContent = STATUSES[a.status] || a.status;
          st.appendChild(b); tr.appendChild(st);
          tr.appendChild(td(a.file_count ? String(a.file_count) : '—', 'muted'));
          tr.appendChild(td(String(a.msg_count), 'muted'));
          tb.appendChild(tr);
        });
        if(fresh.length){
          toast('Новое обращение: ' + fresh.join(', '));
          beep();
        }
        state.firstLoad = false;
      })
      .catch(function(err){ toast(err.message, true); });
  }

  /* ---------- модалка ---------- */
  function fmtTime(iso){ return new Date(iso).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  function isImg(mime, name){ return /^image\//.test(mime || '') || /\.(jpg|jpeg|png|webp|gif)$/i.test(name || ''); }

  function openAppeal(id, silent){
    state.selected = id;
    api('/api/appeals/' + encodeURIComponent(id)).then(function(data){
      if(!silent) $('overlay').classList.add('show');
      var a = data.appeal;
      $('mId').textContent = a.id;
      $('mSub').textContent = (a.subject || 'Без темы') + ' · ' + fmtTime(a.created_at);

      var meta = $('mMeta'); meta.textContent='';
      [['Имя', a.name], ['Контакт', a.contact], ['Направление', a.category], ['Создано', fmtTime(a.created_at)], ['Обновлено', fmtTime(a.updated_at)], ['Статус', STATUSES[a.status] || a.status]]
        .forEach(function(p){
          var d = document.createElement('div');
          var s = document.createElement('span'); s.textContent = p[0];
          var v = document.createElement('div'); v.textContent = p[1];
          d.appendChild(s); d.appendChild(v); meta.appendChild(d);
        });

      var thread = $('mThread'); thread.textContent='';
      data.messages.forEach(function(m){
        var div = document.createElement('div');
        div.className = 'msg ' + (m.author === 'admin' ? 'admin' : 'user');
        var who = document.createElement('span'); who.className='who';
        who.textContent = m.author === 'admin' ? 'Администратор' : a.name;
        var txt = document.createElement('div'); txt.textContent = m.text;
        var time = document.createElement('span'); time.className='time'; time.textContent = fmtTime(m.created_at);
        div.appendChild(who); div.appendChild(txt); div.appendChild(time);
        var atts = data.attachments.filter(function(f){ return f.message_id === m.id; });
        if(atts.length){
          var wrap = document.createElement('div'); wrap.className='atts';
          atts.forEach(function(f){
            var href = '/api/attachments/' + f.id;
            if(isImg(f.mime, f.original_name)){
              var link = document.createElement('a'); link.href = href; link.target='_blank';
              var img = document.createElement('img'); img.className='att-img'; img.src = href; img.alt = f.original_name;
              link.appendChild(img); wrap.appendChild(link);
            } else {
              var a2 = document.createElement('a'); a2.className='att'; a2.href = href; a2.target='_blank';
              a2.textContent = '📎 ' + f.original_name + ' (' + Math.max(1, Math.round(f.size/1024)) + ' КБ)';
              wrap.appendChild(a2);
            }
          });
          div.appendChild(wrap);
        }
        thread.appendChild(div);
      });
      if(silent) thread.scrollTop = thread.scrollHeight;

      var sb = $('mStatusBtns'); sb.textContent='';
      [['in_progress','В работе','btn-warn'], ['answered','Отвечено','btn-ok'], ['closed','Закрыто','btn-ghost'], ['new','Переоткрыть','btn-ghost']]
        .forEach(function(p){
          var b = document.createElement('button');
          b.type='button'; b.className='btn ' + p[2]; b.textContent = p[1];
          b.disabled = a.status === p[0];
          b.addEventListener('click', function(){
            api('/api/appeals/' + encodeURIComponent(a.id), { method:'PATCH', body: JSON.stringify({status:p[0]}) })
              .then(function(){ toast('Статус обновлён'); refreshAll(); })
              .catch(function(e){ toast(e.message, true); });
          });
          sb.appendChild(b);
        });
    }).catch(function(err){ toast(err.message, true); });
  }

  function closeModal(){ $('overlay').classList.remove('show'); state.selected=null; }
  $('mClose').addEventListener('click', closeModal);
  $('overlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
    if(e.ctrlKey && e.key === 'Enter' && state.selected) $('sendReplyBtn').click();
  });

  $('replyFiles').addEventListener('change', function(){
    var names = [];
    for(var i=0;i<this.files.length;i++) names.push(this.files[i].name);
    $('replyFilesHint').textContent = names.length ? names.join(', ') : '';
  });

  $('sendReplyBtn').addEventListener('click', function(){
    if(!state.selected) return;
    var text = $('replyText').value.trim();
    var files = $('replyFiles').files;
    if(!text && !files.length){ toast('Введите текст ответа или прикрепите файл', true); return; }
    var fd = new FormData();
    fd.append('text', text);
    for(var i=0;i<files.length;i++) fd.append('files', files[i], files[i].name);
    var btn = $('sendReplyBtn');
    btn.disabled = true; btn.textContent = 'Отправляем…';
    api('/api/appeals/' + encodeURIComponent(state.selected) + '/reply', { method:'POST', body: fd })
      .then(function(){
        $('replyText').value = ''; $('replyFiles').value = ''; $('replyFilesHint').textContent = '';
        toast('Ответ отправлен');
        openAppeal(state.selected, true);
        loadStats(); loadAppeals();
      })
      .catch(function(e){ toast(e.message, true); })
      .finally(function(){ btn.disabled=false; btn.textContent='Отправить ответ'; });
  });

  /* ---------- сброс всего ---------- */
  $('resetBtn').addEventListener('click', function(){
    if(!confirm('Удалить ВСЕ обращения, переписку и файлы? Это действие необратимо.')) return;
    if(prompt('Для подтверждения введите: УДАЛИТЬ ВСЁ') !== 'УДАЛИТЬ ВСЁ'){ toast('Отменено'); return; }
    api('/api/reset', { method:'POST', body: JSON.stringify({confirm:'УДАЛИТЬ ВСЁ'}) })
      .then(function(){ toast('Все данные удалены'); state.selected=null; closeModal(); state.knownIds={}; state.firstLoad=true; refreshAll(); })
      .catch(function(e){ toast(e.message, true); });
  });

  if(state.token) showPanel();
})();
</script>
</body>
</html>
